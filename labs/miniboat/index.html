<meta charset="utf-8">
<title>Mini Boat Assembly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one workbench column — 3D stage with the step caption, transport controls, then the 12 steps as a clickable sequence. */
:root {
  --bg: #F1F3F1; --panel: #FFFFFF; --ink: #1C2321; --muted: #5C6662; --line: #D4D9D6;
  --accent: #1E6C74; --accent-ink: #FFFFFF; --stage: #E4E8E5; --sink: #A8402F; --float: #2F7D4F;
  --sky: #D6EAF5; --sea: #3F8FC9; --sea-deep: #2C6E9F; --steel: #4F5B66; --steel-hi: #8A97A3; --deck: #C9D2DA; --glass: #9DB7C9;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1C2220; --ink: #E6ECE9; --muted: #98A39E; --line: #2D3532;
  --accent: #63B9C1; --accent-ink: #0E1413; --stage: #19201D; --sink: #E07A66; --float: #6CC291; --sky: #1F3442; --sea: #2F6F9E; --sea-deep: #1F5279; --steel: #9AA6B1; --steel-hi: #C5CED6; --deck: #6B7883; --glass: #6E8EA3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1C2220; --ink: #E6ECE9; --muted: #98A39E; --line: #2D3532;
  --accent: #63B9C1; --accent-ink: #0E1413; --stage: #19201D; --sink: #E07A66; --float: #6CC291; --sky: #1F3442; --sea: #2F6F9E; --sea-deep: #1F5279; --steel: #9AA6B1; --steel-hi: #C5CED6; --deck: #6B7883; --glass: #6E8EA3; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 64ch; }

.stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#view { display: block; width: 100%; height: clamp(340px, 60vw, 620px); touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
.caption { position: absolute; left: 14px; top: 14px; right: 14px; max-width: 50ch; pointer-events: none; display: grid; gap: 2px; }
.caption .n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.caption .t { font-size: 19px; font-weight: 600; }
.caption .t[data-tone="sink"] { color: var(--sink); }
.caption .t[data-tone="float"] { color: var(--float); }
.caption .d { color: var(--muted); font-size: 14px; }
.caption .x { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.hint { position: absolute; right: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); pointer-events: none; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 84px; font-weight: 500; }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
.vstat { font-family: var(--font-mono); font-size: 11px; color: var(--sink); flex-basis: 100%; }
#clock { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }

.part { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -6px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.steps button { width: 100%; height: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; }
.steps .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); grid-row: span 2; padding-top: 2px; }
.steps .nm { font-weight: 600; }
.steps .ps { color: var(--muted); font-size: 13px; }
.steps .ps[data-tone="sink"] { color: var(--sink); }
.steps .ps[data-tone="float"] { color: var(--float); }
.steps button[aria-current="step"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.steps button[aria-current="step"] .k { color: var(--accent); }
.intro { position: absolute; top: 0; left: 0; right: 0; height: clamp(340px, 60vw, 620px); display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 92px 16px 34px; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
.intro.on { opacity: 1; }
.intro figure { margin: 0; width: min(42%, 270px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 10px; display: grid; gap: 6px; }
.intro svg { display: block; width: 100%; height: auto; border-radius: 6px; }
.intro figcaption { font-size: 13px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; }
.intro figcaption b { font-weight: 600; }
.intro .q { font-family: var(--font-mono); font-size: 28px; color: var(--accent); }
.verdict { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.verdict.float { color: var(--float); } .verdict.sink { color: var(--sink); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(-1deg); } }
@keyframes waves { from { transform: translateX(0); } to { transform: translateX(-40px); } }
@keyframes drop { 0% { transform: translateY(-58px); } 30% { transform: translateY(-4px); } 85%, 100% { transform: translateY(66px); } }
@keyframes rise { 0%, 35% { transform: translateY(0); opacity: 0; } 45% { opacity: .9; } 100% { transform: translateY(-60px); opacity: 0; } }
.ship { animation: bob 2.6s ease-in-out infinite; transform-origin: 120px 92px; }
.waves { animation: waves 3s linear infinite; }
.nail { animation: drop 3.2s ease-in infinite; }
.bub { animation: rise 3.2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .ship, .waves, .nail, .bub { animation: none; } }
@media (max-width: 560px) { .intro { padding: 40px 10px 16px; gap: 8px; } .intro .q, .intro .det { display: none; } .intro figure { width: 48%; padding: 6px; } .intro figcaption { font-size: 12px; } }
.player { display: grid; gap: 16px; }
.player:fullscreen, .player.expanded { display: flex; flex-direction: column; gap: 10px; background: var(--bg);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.player.expanded { position: fixed; inset: 0; z-index: 50; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.player:fullscreen .stage, .player.expanded .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.player:fullscreen #view, .player.expanded #view { flex: 1; height: auto; min-height: 0; }
.player:fullscreen .intro, .player.expanded .intro { height: auto; bottom: 0; }
footer { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {  /* phones: caption sits under the picture instead of over it */
  .caption { position: static; max-width: none; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .hint { bottom: auto; top: 10px; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Kriya Quest · Mini boat key holder</div>

const B = DATA.band;
function densify(poly, step = 2) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], n = Math.max(1, Math.round(Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]) / step));

}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
